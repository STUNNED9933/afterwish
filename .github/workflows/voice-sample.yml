# Samples Chatterbox voices next to the current Kokoro ones (tools/voice/sample_chatterbox.py).
# Started by hand only. Free: open model on the runner's CPU, no API keys. Result: an artifact zip.
name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write # only to push the samples to the voice-samples branch

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - run: python tools/voice/sample_chatterbox.py out
      - name: Push to the voice-samples branch
        run: |
          cd out
          git init -q -b voice-samples
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Voice samples ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-samples
