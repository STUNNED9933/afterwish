# Deploys the Weekly Echo server (server/) to Cloudflare Workers with its D1 database.
# Runs when the server or the game rules change, so both always agree on SIM_VERSION.
# One-time setup: README "Weekly Echo server". Until the two secrets exist this does nothing.
name: Deploy Weekly Echo server

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/sim/**', 'src/config.js', '.github/workflows/trial-api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so the server was not deployed. See README: Weekly Echo server."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci && npm test # the rules and the server checks must pass first
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: server
        run: npm ci && npm run deploy
