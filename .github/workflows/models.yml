# Makes animated character models with the Tripo API (tools/models/generate.mjs).
# Started by hand only (Actions → Make character models → Run workflow, or `gh workflow run`).
# Needs the repository secret TRIPO_API_KEY. Results go to the separate `tripo-models` branch
# (one folder per run) for review; nothing touches main or the game automatically.
name: Make character models

on:
  workflow_dispatch:
    inputs:
      characters:
        description: 'Characters from tools/models/roster.json, space-separated'
        required: true
        default: 'warrior'
      dry_run:
        description: 'Plan only (free): no credits spent'
        type: boolean
        default: false

permissions:
  contents: write # only to push results to the tripo-models branch

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tripo-cli@0.11.2
      - name: Make models
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          TRIPO_ANALYTICS_ENABLED: '0'
          TRIPO_NO_UPDATE_CHECK: '1'
          CHARACTERS: ${{ inputs.characters }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node tools/models/generate.mjs $DRY $CHARACTERS
      - name: Save results to the tripo-models branch
        if: always() && !inputs.dry_run
        run: |
          [ -d out/models ] || exit 0
          mv out/models /tmp/models
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin tripo-models >/dev/null; then
            git fetch --depth 1 origin tripo-models && git checkout -B tripo-models FETCH_HEAD
          else
            git checkout --orphan tripo-models && git rm -rq --cached . && git clean -fdq
          fi
          mkdir -p runs && cp -r /tmp/models "runs/${{ github.run_id }}"
          git add runs && git commit -qm "Tripo models: ${{ inputs.characters }} (run ${{ github.run_id }})"
          # several runs may finish together: each writes its own folder, so rebase and try again
          for i in 1 2 3 4 5 6 7 8; do git push -q origin tripo-models && exit 0; sleep $((i * 4)); git fetch -q --depth 50 origin tripo-models && git rebase -q FETCH_HEAD || git rebase --abort; done; exit 1 # (1.1.5: was 'pull --rebase', which failed quietly on the shallow clone and lost four runs' files)
